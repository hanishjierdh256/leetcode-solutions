name: Update README

on:
  schedule:
    # 13:00 UTC = 6:00 AM Calgary in winter (MST); 7:00 AM in summer (MDT).
    # Use "0 12 * * *" during daylight saving time to keep it at 6 AM.
    - cron: "0 13 * * *"
  workflow_dispatch: # lets you run it by hand from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check for new commits in the last 24 hours
        id: check
        run: |
          # Commits that touched anything except README.md (so the bot's own
          # README commits never count as "an update").
          NEW=$(git log --since="24 hours ago" --format=%H -- . ':(exclude)README.md' | wc -l)
          echo "New commits: $NEW"
          if [ "$NEW" -gt 0 ] || [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Regenerate README
        if: steps.check.outputs.run == 'true'
        run: python3 scripts/update_readme.py

      - name: Commit and push if README changed
        if: steps.check.outputs.run == 'true'
        run: |
          if git diff --quiet README.md; then
            echo "README unchanged."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "Update README progress"
          git push
